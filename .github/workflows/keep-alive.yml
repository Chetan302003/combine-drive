name: Keep Aiven Database Alive

on:
  schedule:
    # Runs every 12 hours (at minute 0 past every 12th hour)
    - cron: '0 */3 * * *'
  workflow_dispatch: # Allows you to run it manually from GitHub anytime

jobs:
  ping-db:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install mysql2 dependency
        run: npm install mysql2

      - name: Run database ping script
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          node -e "
            const mysql = require('mysql2/promise');
            async function ping() {
              const connection = await mysql.createConnection(process.env.DATABASE_URL);
              await connection.query('SELECT 1');
              await connection.end();
              console.log('Database successfully pinged and kept alive!');
            }
            ping().catch(err => {
              console.error('Ping failed:', err);
              process.exit(1);
            });
          "
